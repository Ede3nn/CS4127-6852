<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Discover Brunei</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Header and navigation -->
    <header class="centered-header">
        <h1>Contact and Enquiries.</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="attractions.html">Attractions</a></li>
                <li><a href="food.html">Food</a></li>
                <li><a href="plan-your-visit.html">Plan Your Visit</a></li>
                <li><a href="culture-events.html">Culture & Events</a></li>
                <li><a href="contact.html" aria-current="page">Contact/Enquiries</a></li>
            </ul>
        </nav>
    </header>
    <!-- Main content -->
    <main id="main">
        <div class="wrap">
            <h1>Contact and Enquiries</h1>

            <section>
                <h2>Send an enquiry</h2>
                <form id="enquiry-form" novalidate>

                    <div class="field">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" autocomplete="name" aria-describedby="name-error">
                        <p class="error" id="name-error"></p>
                    </div>

                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" autocomplete="email" aria-describedby="email-error">
                        <p class="error" id="email-error"></p>
                    </div>

                    <div class="field">
                        <label for="topic">What is your enquiry about?</label>
                        <select id="topic" name="topic" aria-describedby="topic-error">
                            <option value="">Select a topic</option>
                            <option value="attractions">Attractions</option>
                            <option value="food">Food</option>
                            <option value="plan-your-visit">Travel and visas</option>
                            <option value="culture-events">Other</option>
                        </select>
                        <p class="error" id="topic-error"></p>
                    </div>

                    <div class="field">
                        <label for="message">Your message</label>
                        <textarea id="message" name="message" rows="5" aria-describedby="message-error"></textarea>
                        <p class="error" id="message-error"></p>
                    </div>

                    <button type="submit" class="btn">Submit Enquiry</button>
                    <p id="form-status" role="status"></p>
                </form>
            </section>
        </div>
    </main>
<footer>
        <p>&copy; 2026 Brunei Tourism Board. All rights reserved.</p>
        <p>Questions? <a href="contact.html">Contact us through here</a></p>
</footer>
</body>

</html>
